{% extends "base.html" %}

{% block title %}Password Updated{% endblock %}

{% block content %}
  <section class="mx-auto max-w-2xl px-4 py-12 text-center sm:px-6 lg:px-8">
    <div class="rounded-2xl border border-emerald-200 bg-white p-8 shadow-sm">
      <p class="text-sm uppercase tracking-[0.16em] text-emerald-700">Security</p>
      <h1 class="mt-2 text-3xl font-semibold tracking-tight text-stone-950">Password updated</h1>
      <p class="mt-3 text-sm leading-6 text-stone-600">
        Your session stays active and your account is ready to use.
      </p>
      <a href="{% url 'account-detail' %}" class="mt-6 inline-flex rounded-md bg-stone-950 px-5 py-3 text-sm font-semibold text-white transition hover:bg-stone-800">
        Return to account
      </a>
    </div>
  </section>
{% endblock %}
