<article class="overflow-hidden rounded-lg border border-amber-200 bg-white shadow-sm">
  <div class="flex aspect-[4/3] items-center justify-center bg-gradient-to-br from-amber-100 via-amber-50 to-stone-100">
    <div class="px-4 text-center">
      <p class="text-xs uppercase tracking-[0.2em] text-amber-700">{{ product.category.name }}</p>
      <h3 class="mt-2 text-lg font-semibold tracking-tight text-stone-900">{{ product.name }}</h3>
    </div>
  </div>
  <div class="space-y-4 p-5">
    <div class="space-y-2">
      <div class="flex items-start justify-between gap-4">
        <h3 class="text-lg font-semibold tracking-tight text-stone-950">{{ product.name }}</h3>
        <p class="text-lg font-semibold text-amber-900">${{ product.price }}</p>
      </div>
      <p class="text-sm leading-6 text-stone-600">{{ product.description|truncatewords:22 }}</p>
    </div>
    <div class="flex flex-wrap items-center gap-2 text-xs text-stone-500">
      <span class="rounded-full bg-amber-100 px-2.5 py-1 font-medium text-amber-900">{{ product.category.name }}</span>
      <span class="rounded-full bg-stone-100 px-2.5 py-1 font-medium text-stone-700">{{ product.stock }} in stock</span>
      {% if product.popularity is not None %}
        <span class="rounded-full bg-stone-100 px-2.5 py-1 font-medium text-stone-700">{{ product.popularity }} sold</span>
      {% endif %}
    </div>
  </div>
</article>
