<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hop & Barley Store{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  </head>
  <body class="min-h-screen bg-amber-50 text-stone-900">
    <div class="min-h-screen">
      <header class="border-b border-amber-200 bg-white/90 backdrop-blur">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
          <a href="{% url 'home' %}" class="text-lg font-semibold tracking-tight text-stone-900">
            Hop & Barley Store
          </a>
          <nav class="flex items-center gap-4 text-sm text-stone-700">
            <a href="{% url 'home' %}" class="transition hover:text-stone-950">Home</a>
            <a href="{% url 'product-list' %}" class="transition hover:text-stone-950">Catalog</a>
            <a href="{% url 'cart-detail' %}" class="transition hover:text-stone-950">Cart</a>
            {% if request.user.is_authenticated %}
              <a href="{% url 'account-orders' %}" class="transition hover:text-stone-950">My orders</a>
              <a href="{% url 'account-detail' %}" class="transition hover:text-stone-950">Account</a>
              <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="transition hover:text-stone-950">Logout</button>
              </form>
            {% else %}
              <a href="{% url 'login' %}" class="transition hover:text-stone-950">Sign in</a>
              <a href="{% url 'register' %}" class="transition hover:text-stone-950">Register</a>
            {% endif %}
            <a href="/admin/" class="transition hover:text-stone-950">Admin</a>
          </nav>
        </div>
      </header>
      <main>
        {% if messages %}
          <div class="mx-auto max-w-7xl px-4 pt-4 sm:px-6 lg:px-8">
            <div class="space-y-2">
              {% for message in messages %}
                <div class="rounded-md border border-amber-200 bg-white px-4 py-3 text-sm text-stone-700 shadow-sm">
                  {{ message }}
                </div>
              {% endfor %}
            </div>
          </div>
        {% endif %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
