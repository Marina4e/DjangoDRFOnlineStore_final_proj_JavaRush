<div{% if class_name %} class="{{ class_name }}"{% endif %}>
  <label for="{{ field.id_for_label }}" class="mb-2 block text-sm font-medium text-stone-800">
    {{ field.label }}
  </label>
  {{ field.as_widget|safe }}
  {% if field.help_text %}
    <p class="mt-1 text-xs text-stone-500">{{ field.help_text }}</p>
  {% endif %}
  {% if field.errors %}
    <p class="mt-2 text-sm text-rose-700">{{ field.errors|join:", " }}</p>
  {% endif %}
</div>
